[project]
name = "qqbotforfun"
version = "0.1.0"
description = "A multi-game QQ group bot platform, powered by NoneBot2 + NapCat + LLM."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "owner" },
]

dependencies = [
    # Bot framework
    "nonebot2[fastapi,websockets]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.5.0",

    # Data
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",

    # LLM
    "openai>=1.40",

    # Config & utils
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "chinesecalendar>=1.9",

    # Finance data
    "akshare>=1.18",
    "numpy>=1.26",

    # Image rendering (bracket charts)
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
qqbot = "src.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI/Depends style)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
# 默认跳过 ra2 标记（红警2斗蛐蛐战斗模拟，约 32s，占全套测试 ~70%）。
# 玩法仍在线、代码与测试均保留，只是日常不跑。改动 ra2_battle 时必须手动跑：
#   uv run pytest tests/games/ra2_battle -m ra2
addopts = "-ra -q -m 'not ra2'"
markers = [
    "ra2: 红警2斗蛐蛐战斗模拟测试（默认跳过，见 docs/games/ra2-battle.md §9.4）",
]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
