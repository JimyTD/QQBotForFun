name: qqbot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qqbot
      POSTGRES_PASSWORD: qqbot_pass
      POSTGRES_DB: qqbot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qqbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ⚠️ napcat 故意不加 logging 限制：修改此 service 定义会触发容器重建，
  # 而 NapCat 每次删容器重建都需要重新扫码（登录态与网络配置的重建行为已知有坑，
  # 见 docs/ops-guide.md §3）。为了日志滚动去冒重新扫码的风险不值得，维持原样。
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      - WEBUI_PORT=6099
    ports:
      - "6099:6099"       # Web UI（建议仅内网访问）
    volumes:
      - napcat_data:/app/napcat

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      napcat:
        condition: service_started
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://qqbot:qqbot_pass@postgres:5432/qqbot
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
    # ⚠️ 固定卷名，确保换目录部署时数据不丢失
    # 首次部署需手动创建：docker volume create qqbot_pg_data
    external: true
    name: qqbot_pg_data
  redis_data:
    external: true
    name: qqbot_redis_data
  napcat_data:
    external: true
    name: qqbot_napcat_data
