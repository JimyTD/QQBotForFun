<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>帝国3斗蛐蛐 · 二维实时战场</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=20261008-1" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">2D</span>
        <div>
          <h1>帝国3斗蛐蛐</h1>
          <p>二维实时战场 · 开发观测</p>
        </div>
      </div>
      <div class="status" id="status">等待模拟…</div>
    </header>

    <main class="layout">
      <aside class="setup-rail" aria-label="编成设置">
        <div class="rail-head">
          <span class="eyebrow">编成</span>
        </div>
        <div class="mode-tabs" role="tablist" aria-label="模拟模式">
          <button type="button" class="mode-tab active" data-mode="custom">自选阵容</button>
          <button type="button" class="mode-tab" data-mode="units">快速单挑</button>
          <button type="button" class="mode-tab" data-mode="civ_war">国战随机</button>
        </div>

        <section class="setup-panel hidden" id="custom-setup">
          <div class="side-block" data-side="red">
            <div class="side-block-head red"><span>🔴 红方</span></div>
            <div class="side-inline">
              <label><span>文明</span><select class="civ-select" data-side="red"></select></label>
              <label><span>时代</span>
                <select class="side-age" data-side="red">
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </label>
            </div>
            <div class="custom-units" data-side="red"></div>
            <button type="button" class="ghost-button add-unit" data-side="red">+ 添加兵种</button>
            <div class="tech-select" data-side="red"></div>
          </div>
          <div class="side-block" data-side="blue">
            <div class="side-block-head blue"><span>🔵 蓝方</span></div>
            <div class="side-inline">
              <label><span>文明</span><select class="civ-select" data-side="blue"></select></label>
              <label><span>时代</span>
                <select class="side-age" data-side="blue">
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </label>
            </div>
            <div class="custom-units" data-side="blue"></div>
            <button type="button" class="ghost-button add-unit" data-side="blue">+ 添加兵种</button>
            <div class="tech-select" data-side="blue"></div>
          </div>
        </section>

        <section class="setup-panel hidden" id="units-setup">
          <label>
            <span>红方兵种</span>
            <input id="red-unit" list="unit-options" value="musketeer" autocomplete="off" />
          </label>
          <label class="count-field">
            <span>数量</span>
            <input id="red-count" type="number" min="1" max="1000" value="40" />
          </label>
          <label>
            <span>蓝方兵种</span>
            <input id="blue-unit" list="unit-options" value="pikeman" autocomplete="off" />
          </label>
          <label class="count-field">
            <span>数量</span>
            <input id="blue-count" type="number" min="1" max="1000" value="40" />
          </label>
        </section>

        <section class="setup-panel hidden" id="civ-war-setup">
          <label><span>红方文明</span><select id="red-civ"></select></label>
          <label><span>蓝方文明</span><select id="blue-civ"></select></label>
          <label class="age-field">
            <span>时代</span>
            <select id="age">
              <option value="3" selected>3 时代</option>
              <option value="4">4 时代</option>
              <option value="5">5 时代</option>
            </select>
          </label>
        </section>

        <details class="advanced">
          <summary>高级设置</summary>
          <label class="seed-field">
            <span>Seed</span>
            <input id="seed" type="number" value="42" />
          </label>
          <p class="hint">Seed 决定战斗内的随机数（出手/溅射结算顺序等）。同一阵容 + 同一 Seed = 可复现的同一局。</p>
          <label class="toggle"><input type="checkbox" id="balance-blue" /><span>蓝方军费随红方自动平衡</span></label>
        </details>

        <button id="restart" type="button" class="start-button">开始模拟</button>
      </aside>

      <section class="stage-panel">
        <div class="match-label" id="match-label">自选阵容</div>
        <div class="army-strip" id="army-strip">
          <article class="army-card red" id="army-red">
            <div class="army-heading">
              <span>🔴 红方</span>
              <strong class="army-alive">— / —</strong>
            </div>
            <div class="army-composition">等待数据…</div>
            <div class="army-hp-row">
              <div class="hp-track"><i></i></div>
              <span class="hp-ratio">—</span>
            </div>
            <div class="army-meta">
              <span class="army-moving">移动 —</span>
              <span class="army-stopped">停止 —</span>
              <span class="army-kills">击杀 —</span>
            </div>
            <div class="army-damage">有效伤害 — · 原始 — · 过量 —</div>
          </article>
          <article class="army-card blue" id="army-blue">
            <div class="army-heading">
              <span>🔵 蓝方</span>
              <strong class="army-alive">— / —</strong>
            </div>
            <div class="army-composition">等待数据…</div>
            <div class="army-hp-row">
              <div class="hp-track"><i></i></div>
              <span class="hp-ratio">—</span>
            </div>
            <div class="army-meta">
              <span class="army-moving">移动 —</span>
              <span class="army-stopped">停止 —</span>
              <span class="army-kills">击杀 —</span>
            </div>
            <div class="army-damage">有效伤害 — · 原始 — · 过量 —</div>
          </article>
        </div>
        <div class="stage-head">
          <div>
            <span class="eyebrow">战场</span>
            <strong id="time-label">t = 0.0s</strong>
          </div>
          <div class="legend">
            <span><i class="dot red"></i>红方</span>
            <span><i class="dot blue"></i>蓝方</span>
            <span><i class="ring charge"></i>蓄力就绪</span>
            <span><i class="ring stopped"></i>已停止攻击</span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="battlefield"></canvas>
        </div>
      </section>

      <aside class="battle-rail" aria-label="战况与播放控制">
        <section class="controls">
          <div class="overlay-controls">
            <label><input type="checkbox" id="show-trails" checked />轨迹</label>
            <label><input type="checkbox" id="show-targets" />目标连线</label>
            <label><input type="checkbox" id="show-charge" checked />蓄力环</label>
          </div>
          <div class="control-row">
            <button id="pause" type="button">暂停</button>
            <button id="step-back" type="button">后退</button>
            <button id="step-forward" type="button">前进</button>
            <button id="live" type="button" class="active">实时</button>
          </div>
          <label class="timeline">
            <span>帧轴</span>
            <input id="timeline" type="range" min="0" max="0" value="0" />
          </label>
          <label class="speed-control">
            <span>播放速度</span>
            <select id="speed">
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
        </section>

        <section class="detail">
          <span class="eyebrow">选中单位</span>
          <div id="unit-detail" class="empty">点击战场单位查看详情</div>
        </section>

        <section class="attack-log-panel">
          <div class="panel-head">
            <span class="eyebrow">攻击日志</span>
            <label class="toggle small"><input type="checkbox" id="charge-only" /><span>仅蓄力</span></label>
          </div>
          <div id="attack-log" class="attack-log empty">等待攻击…</div>
        </section>
      </aside>
    </main>

    <datalist id="unit-options"></datalist>
    <script src="viewer.js?v=20261008-1"></script>
  </body>
</html>
