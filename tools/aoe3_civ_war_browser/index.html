<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>帝国 3 国战编制浏览器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" aria-label="帝国 3 国战编制浏览器">
        <span class="brand-mark">III</span>
        <span>国战编制浏览器</span>
        <span class="review-badge">开发审查</span>
      </div>
      <label class="civ-picker">
        <span class="sr-only">选择文明</span>
        <input id="civ-search" list="civ-options" autocomplete="off" placeholder="搜索文明" />
        <datalist id="civ-options"></datalist>
      </label>
      <div class="age-control" role="group" aria-label="时代">
        <button type="button" data-age="3" class="active">III</button>
        <button type="button" data-age="4">IV</button>
        <button type="button" data-age="5">V</button>
      </div>
      <label class="toggle">
        <input id="local-only" type="checkbox" />
        <span>仅本国单位</span>
      </label>
      <label class="toggle">
        <input id="include-consulate" type="checkbox" checked />
        <span>包含领事馆</span>
      </label>
    </header>

    <main class="shell">
      <aside class="units-panel" aria-label="正规军单位列表">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">正规军兵池</p>
            <h1 id="civ-title">加载中</h1>
          </div>
          <span id="unit-count" class="count"></span>
        </div>
        <div id="quick-civs" class="quick-civs" aria-label="代表文明快捷切换"></div>
        <div id="unit-list" class="unit-list"></div>
      </aside>

      <section class="workspace">
        <nav class="tabs" aria-label="浏览视图">
          <button type="button" class="tab" data-tab="lineups">通用骨架</button>
          <button type="button" class="tab active" data-tab="national">优势策略审核</button>
          <button type="button" class="tab" data-tab="audit">审计</button>
        </nav>

        <section id="lineups-view" class="view" aria-label="通用骨架候选">
          <div class="view-header">
            <div>
              <p class="eyebrow">已解析为具体单位</p>
              <h2>通用骨架候选</h2>
            </div>
            <p id="lineup-summary" class="muted"></p>
          </div>
          <div id="archetype-list" class="archetype-list"></div>
        </section>

        <section id="national-view" class="view active" aria-label="国家战术">
          <div class="view-header">
            <div>
              <p class="eyebrow">第一版 · 已启用 · 可继续维护</p>
              <h2>国家优势策略</h2>
            </div>
            <p id="preferred-summary" class="muted"></p>
          </div>
          <div class="review-notice" id="preferred-note"></div>
          <div id="preferred-civ-nav" class="preferred-civ-nav" aria-label="优势策略文明导航"></div>
          <section class="national-section preferred-review-section">
            <div class="section-title-row">
              <h3 id="preferred-civ-title">当前文明</h3>
              <button id="add-preferred" class="text-command" type="button">新增策略</button>
            </div>
            <p class="muted">展示使用当前时代升级和 10000 资源换算后的实际人数。草案不会进入正式国战随机。</p>
            <div id="preferred-list" class="preferred-list"></div>
          </section>
        </section>

        <section id="audit-view" class="view" aria-label="审计">
          <div class="view-header">
            <div>
              <p class="eyebrow">规则输出</p>
              <h2>文明审计</h2>
            </div>
          </div>
          <div class="audit-grid">
            <section class="audit-section">
              <h3>骨架候选数</h3>
              <div id="candidate-counts" class="candidate-counts"></div>
            </section>
            <section class="audit-section">
              <h3>生态位覆盖</h3>
              <div id="role-coverage" class="role-coverage"></div>
            </section>
          </div>
          <section class="audit-section exclusions">
            <div class="section-title-row">
              <h3>排除与当前时代不可用</h3>
              <span id="excluded-count" class="count"></span>
            </div>
            <div id="excluded-list" class="excluded-list"></div>
          </section>
        </section>
      </section>
    </main>

    <template id="unit-icon-template">
      <span class="unit-icon fallback" aria-hidden="true"></span>
    </template>
    <dialog id="tactic-editor" class="tactic-dialog">
      <form id="tactic-form" method="dialog">
        <header class="dialog-header">
          <div><p class="eyebrow">策略维护</p><h2 id="editor-heading">编辑优势策略</h2></div>
          <button type="button" id="close-editor" class="icon-command" aria-label="关闭">×</button>
        </header>
        <input id="editor-id" type="hidden" />
        <label class="editor-field"><span>策略名称</span><input id="editor-title" maxlength="30" required /></label>
        <div class="editor-grid">
          <label class="editor-field"><span>最早时代</span><select id="editor-age"><option value="3">3 时代</option><option value="4">4 时代</option><option value="5">5 时代</option></select></label>
          <label class="editor-field"><span>依据标签，逗号分隔</span><input id="editor-basis" maxlength="80" placeholder="皇家护卫, 经典火枪马" /></label>
        </div>
        <label class="editor-activation"><input id="editor-approved" type="checkbox" /><span>正式启用到国战随机；不勾选则只作为审核草案展示</span></label>
        <div class="editor-units-heading"><span>兵种与资源占比</span><span id="share-total">合计 100%</span></div>
        <div id="editor-unit-rows" class="editor-unit-rows"></div>
        <label class="editor-field"><span>入选说明</span><textarea id="editor-reason" rows="3" maxlength="240" required></textarea></label>
        <div id="editor-error" class="editor-error" role="alert"></div>
        <footer class="dialog-actions">
          <button type="button" id="delete-tactic" class="danger-command">删除策略</button>
          <span class="dialog-spacer"></span>
          <button type="button" id="cancel-editor" class="secondary-command">取消</button>
          <button type="submit" class="primary-command">保存策略</button>
        </footer>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
