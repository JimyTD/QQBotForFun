providers:
  zhipu:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${ZHIPU_API_KEY}
    timeout_seconds: 60

  longcat:
    base_url: https://api.longcat.chat/openai
    api_key: ${LONGCAT_API_KEY}
    timeout_seconds: 30

  # 腾讯云 TokenHub（广州站）——单 Key 多模型，OpenAI 兼容。
  # 本项目**只消费免费额度**：额度按模型各自独立、不刷新、用完/下线即失效。
  # 每个模型要在控制台单独开通，未开通会返回 402（会被判为「额度耗尽」而降档）。
  # ⚠️ 广州站与新加坡站 Key 不互通；此处对应广州站的 base_url。
  tokenhub:
    base_url: https://tokenhub.tencentmaas.com/v1
    api_key: ${TOKENHUB_API_KEY}
    timeout_seconds: 60

defaults:
  retries: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 10.0

# =====================================================================
# 阶梯链（ladder）配置说明
# =====================================================================
# 设计文档：docs/08-llm-integration.md §2、§4.2
#
# 每个 scene 的 `chain` 是一条**有序候选链**：
#   - 链头是首选档，依次往后是降级档；
#   - 某档**额度耗尽 / 鉴权失败 / 模型下线**时打冷却并**自动降下一档**；
#   - 限流与网络抖动只在档内退避重试，不降档；
#   - 冷却中的档会被**直接跳过**（不浪费一次调用）；
#   - 返回值里的 model/provider 是**实际生效**的那一档，chain_index>0 表示降过档。
#
# 链元素的两种写法：
#   - `glm-5.1`          → 继承本 scene 的 `provider`
#   - `tokenhub:glm-5.1` → 显式指定 provider（可跨家兜底）
#
# 旧的 `provider:` + `model:` 单模型写法仍然有效（等价于只有一个元素的链）。
#
# ---------------------------------------------------------------------
# A 类公共序：只串「旧 / 临期」档 —— 额度不用就是作废，好资源留给别的安排
# ---------------------------------------------------------------------
# 组 1（标称 2026-09-08 已下线，随时失效，最先烧）
#   tokenhub:qwen3.5-plus / qwen3.5-flash
# 组 2（2026-10-08 下线）
#   tokenhub:glm-5.1 / glm-5 / glm-5-turbo
# 组 3（旧版本快照，会被优先清理）
#   tokenhub:deepseek-v4-pro-202606 / -0813
#   tokenhub:deepseek-v4-flash-202605 / -0731
# 组 4（上代通用 + 角色扮演）
#   tokenhub:kimi-k2.5 / minimax-m2.7 / hunyuan-role-latest / hy-role
# 尾档（另一家的免费池，永续兜底）
#   zhipu:glm-4-flash-250414
#
# ⚠️ 已知后果：A 类全部下线/耗尽后，TokenHub 这条线会整段归零，
#    直接落到链尾的智谱。这是**已确认接受**的行为，届时再开新的临期资源。
#
# ⚠️ 链序目前是「剩余寿命升序 + 组内质量降序」的**人工初判**，
#    尚未经 golden eval 验证（见规划 §5.5.0.2）。P1 跑完 eval_judge_compare.py
#    后按实测结果调整。
# =====================================================================

scenes:
  default:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:glm-5.1
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:kimi-k2.5
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.7
    max_tokens: 1024

  # 出题：1 次/局、创意第一印象 → 创意向的档提前
  turtle_soup_host:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:kimi-k2.5
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:glm-5.1
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.9
    max_tokens: 2048
    json_mode_default: true
    # 1 次/局：玩家在等开局，可以多给点时间，但仍要封顶。
    timeout_seconds: 30
    retries: 1
    total_timeout_seconds: 60

  # 提问判定：一局 20-50 次且超时只有 30s → 低延迟档必须靠前，
  # 否则链头一思考就超时，每次调用都要白等一轮。
  turtle_soup_judge:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:glm-5.1
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:kimi-k2.5
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.1
    # 256 → 512：TokenHub 的档常先吐一段解释再给 JSON（实测输出 112–256 token），
    # 256 会把 JSON 截掉一半，反而触发重试。留出余量比省这点 token 划算。
    max_tokens: 512
    json_mode_default: true
    # 高频（20–50 次/局）：单次 20s 封顶，且**不在同一档反复重试** ——
    # 「不输出 JSON」是这一档的特性而非临时故障，重试同档意义不大，留给降档更划算。
    # 实测单次成功 3.6–4.4s，20s 有 4 倍余量。
    timeout_seconds: 20
    retries: 1
    # 硬闸：含全部降档尝试在内，30s 仍无结果就交回调用方（提示"汤主走神了"）。
    # 不设的话 12 档 × 20s 累积起来最坏十几分钟（09-20 实测单次已到 92s）。
    total_timeout_seconds: 30

  # 宣告判定：1-3 次/局但决定胜负 → 判定质量优先
  turtle_soup_claim:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:glm-5.1
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:kimi-k2.5
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.2
    max_tokens: 512
    json_mode_default: true
    # 1–3 次/局但决定胜负 → 比 judge 宽松些，仍设硬闸。
    # 09-20 实测最坏一次 92s（连降 4 档 × 每档重试 3 次），45s 单次 × 3 次是主因。
    timeout_seconds: 25
    retries: 1
    total_timeout_seconds: 50

  trivia_host:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:glm-5.1
      - tokenhub:kimi-k2.5
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.9
    max_tokens: 1024
    json_mode_default: true
    timeout_seconds: 25
    retries: 1
    total_timeout_seconds: 45

  # 长文归纳吃上下文窗口
  web_search:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:glm-5.1
      - tokenhub:kimi-k2.5
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.3
    # 2048 才装得下 prompt 要求的 200–700 字（原文 1536 常被打满后硬截断）
    max_tokens: 2048
    # 群聊交互：单次 15s + 不重试 → 单档最坏 15s 就降档。
    # 原 45s × retries 3 = 135s，实测让用户干等 153 秒（2026-09-18 日志）。
    timeout_seconds: 15
    retries: 1
    # 硬闸：含全部降档尝试在内，25s 仍无结果就交回调用方走摘要降级。
    # 不设的话链上 12 档 × 15s 仍可能累积到 3 分钟。
    total_timeout_seconds: 25

  ask_ai:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:glm-5.1
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:kimi-k2.5
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.7
    # 与 web_search 一致：装得下 200–700 字，且不拖长用户等待
    max_tokens: 2048
    timeout_seconds: 15
    retries: 1
    total_timeout_seconds: 25

  finance_report:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:glm-5-turbo
      - tokenhub:glm-5
      - tokenhub:glm-5.1
      - tokenhub:minimax-m2.7
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:kimi-k2.5
      - zhipu:glm-4-flash-250414
    temperature: 0.7
    max_tokens: 512
    timeout_seconds: 30

  # AI 玩家决策：高频、要 JSON、超时窗口只有 30s。
  # `hunyuan-role-latest` / `hy-role` 是角色扮演专用档，放在这里最对口。
  silent_mark_ai:
    chain:
      - tokenhub:qwen3.5-plus
      - tokenhub:qwen3.5-flash
      - tokenhub:hunyuan-role-latest
      - tokenhub:hy-role
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:glm-5.1
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:deepseek-v4-pro-202606
      - tokenhub:deepseek-v4-pro-0813
      - tokenhub:kimi-k2.5
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.3
    max_tokens: 1024
    json_mode_default: true
    # 高频 AI 决策：玩家在等回合，硬闸压紧。
    timeout_seconds: 20
    retries: 1
    total_timeout_seconds: 30

  # AI 取名：输出仅 20 token，用不着强档，短超时
  silent_mark_ai_name:
    chain:
      - tokenhub:qwen3.5-flash
      - tokenhub:qwen3.5-plus
      - tokenhub:glm-5
      - tokenhub:glm-5-turbo
      - tokenhub:glm-5.1
      - tokenhub:deepseek-v4-flash-202605
      - tokenhub:deepseek-v4-flash-0731
      - tokenhub:kimi-k2.5
      - tokenhub:minimax-m2.7
      - zhipu:glm-4-flash-250414
    temperature: 0.9
    max_tokens: 20
    json_mode_default: false
    timeout_seconds: 15
    retries: 1
    total_timeout_seconds: 20
